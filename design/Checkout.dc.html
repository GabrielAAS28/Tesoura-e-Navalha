<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .scroller::-webkit-scrollbar { display: none; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#121214;display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div style="display:flex;align-items:center;gap:16px;padding:28px 20px 12px;flex-shrink:0;">
    <div style="width:44px;height:44px;border-radius:12px;background:#1E1E24;border:1px solid #3F3F46;display:flex;align-items:center;justify-content:center;color:#F4F4F5;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </div>
    <div style="font-size:20px;font-weight:600;color:#F4F4F5;">Confirmar Agendamento</div>
  </div>

  <div class="scroller" style="flex:1;overflow-y:auto;padding:16px 20px 40px;display:flex;flex-direction:column;gap:24px;">

    <div style="background:#1E1E24;border:1px solid #3F3F46;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:16px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:48px;height:48px;border-radius:999px;background:linear-gradient(135deg,#3F3F46,#26262E);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#F4F4F5;">RC</div>
        <div style="display:flex;flex-direction:column;gap:2px;">
          <div style="font-size:14px;font-weight:600;color:#F4F4F5;">Rafael C.</div>
          <div style="font-size:12px;font-weight:400;color:#A1A1AA;">Barbeiro sênior</div>
        </div>
      </div>
      <div style="height:1px;background:#3F3F46;"></div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="font-size:13px;color:#A1A1AA;">Serviço</div>
          <div style="font-size:13px;font-weight:600;color:#F4F4F5;">Corte Clássico</div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="font-size:13px;color:#A1A1AA;">Data</div>
          <div style="font-size:13px;font-weight:600;color:#F4F4F5;">Qua, 11 de março</div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="font-size:13px;color:#A1A1AA;">Horário</div>
          <div style="font-size:13px;font-weight:600;color:#F4F4F5;">09:30</div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="font-size:13px;color:#A1A1AA;">Duração</div>
          <div style="font-size:13px;font-weight:600;color:#F4F4F5;">40 min</div>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="font-size:15px;font-weight:600;color:#F4F4F5;">Forma de pagamento</div>

      <div style="display:flex;align-items:center;gap:14px;background:rgba(217,119,6,0.10);border:1.5px solid #D97706;border-radius:16px;padding:14px 16px;">
        <div style="width:40px;height:40px;border-radius:12px;background:rgba(217,119,6,0.18);display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#D97706" stroke="none"><path d="M13 2L3 14h7l-1 8 11-14h-7z"/></svg>
        </div>
        <div style="flex:1;font-size:14px;font-weight:600;color:#F4F4F5;">PIX</div>
        <div style="width:20px;height:20px;border-radius:999px;background:#D97706;display:flex;align-items:center;justify-content:center;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#121214" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:14px;background:#1E1E24;border:1px solid #3F3F46;border-radius:16px;padding:14px 16px;">
        <div style="width:40px;height:40px;border-radius:12px;background:rgba(217,119,6,0.10);display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
        </div>
        <div style="flex:1;font-size:14px;font-weight:600;color:#F4F4F5;">Cartão de crédito</div>
        <div style="width:20px;height:20px;border-radius:999px;border:1.5px solid #3F3F46;"></div>
      </div>

      <div style="display:flex;align-items:center;gap:14px;background:#1E1E24;border:1px solid #3F3F46;border-radius:16px;padding:14px 16px;">
        <div style="width:40px;height:40px;border-radius:12px;background:rgba(217,119,6,0.10);display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-7.5 7-12a7 7 0 1 0-14 0c0 4.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
        </div>
        <div style="flex:1;font-size:14px;font-weight:600;color:#F4F4F5;">Pagar no local</div>
        <div style="width:20px;height:20px;border-radius:999px;border:1.5px solid #3F3F46;"></div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;padding-top:4px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="font-size:13px;color:#A1A1AA;">Subtotal</div>
        <div style="font-size:13px;color:#F4F4F5;">R$ 45,00</div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="font-size:13px;color:#A1A1AA;">Taxa de serviço</div>
        <div style="font-size:13px;color:#F4F4F5;">R$ 0,00</div>
      </div>
      <div style="height:1px;background:#3F3F46;margin:4px 0;"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="font-size:15px;font-weight:600;color:#F4F4F5;">Total</div>
        <div style="font-size:18px;font-weight:700;color:#D97706;">R$ 45,00</div>
      </div>
    </div>

  </div>

  <div style="position:absolute;bottom:0;left:0;right:0;padding:14px 20px 24px;background:linear-gradient(180deg,rgba(18,18,20,0) 0%,#121214 30%);display:flex;flex-direction:column;gap:10px;align-items:center;">
    <button style="width:100%;height:52px;border:none;border-radius:12px;background:#D97706;color:#121214;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;">Confirmar Pagamento</button>
    <div style="font-size:11px;color:#A1A1AA;text-align:center;">Cancelamento gratuito até 2h antes do horário</div>
  </div>
</div>
</x-dc>
</body>
</html>
