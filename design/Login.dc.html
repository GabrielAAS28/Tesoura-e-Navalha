<!doctype html>
<html>

<x-dc>

<div style="width:390px;height:844px;background:#121214;display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div class="scroller" style="flex:1;overflow-y:auto;padding:56px 24px 40px;display:flex;flex-direction:column;gap:28px;">

    <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">

        <path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.4l-6.3-5.4C29.3 34.7 26.8 35.6 24 35.6c-5.2 0-9.6-3.5-11.2-8.2l-6.5 5C9.9 39.7 16.4 44 24 44z"/>

    <div style="display:flex;align-items:center;gap:12px;">
      <div style="flex:1;height:1px;background:#3F3F46;"></div>

      <div style="flex:1;height:1px;background:#3F3F46;"></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px;">
      <div style="display:flex;flex-direction:column;gap:8px;">
        <div style="font-size:12px;font-weight:600;color:#A1A1AA;">Nome completo</div>
        <div style="height:52px;border-radius:12px;background:#1E1E24;border:1px solid #3F3F46;display:flex;align-items:center;padding:0 14px;">
          <input type="text" placeholder="Seu nome" style="flex:1;border:none;background:transparent;outline:none;font-family:inherit;font-size:14px;font-weight:500;color:#F4F4F5;">
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;">
        <div style="font-size:12px;font-weight:600;color:#A1A1AA;">Número de telefone</div>
        <div style="height:52px;border-radius:12px;background:#1E1E24;border:1px solid #3F3F46;display:flex;align-items:center;padding:0 6px 0 14px;gap:10px;">
          <div style="display:flex;align-items:center;gap:6px;padding-right:10px;border-right:1px solid #3F3F46;">
            <span style="font-size:15px;">🇧🇷</span>
            <span style="font-size:14px;font-weight:600;color:#F4F4F5;">+55</span>

        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;">
        <div style="font-size:12px;font-weight:600;color:#A1A1AA;">Senha</div>
        <div style="height:52px;border-radius:12px;background:#1E1E24;border:1px solid #3F3F46;display:flex;align-items:center;padding:0 0 0 14px;">
          <input type="password" placeholder="••••••••" style="flex:1;border:none;background:transparent;outline:none;font-family:inherit;font-size:14px;font-weight:500;color:#F4F4F5;">
          <div style="width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;">
        <div style="font-size:12px;font-weight:600;color:#A1A1AA;">Confirmar senha</div>
        <div style="height:52px;border-radius:12px;background:#1E1E24;border:1px solid #3F3F46;display:flex;align-items:center;padding:0 0 0 14px;">
          <input type="password" placeholder="••••••••" style="flex:1;border:none;background:transparent;outline:none;font-family:inherit;font-size:14px;font-weight:500;color:#F4F4F5;">
          <div style="width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
        </div>
      </div>

      <a href="#" style="align-self:flex-end;font-size:12px;font-weight:600;">Esqueci minha senha</a>
    </div>

    <button style="width:100%;height:52px;border:none;border-radius:12px;background:#D97706;color:#121214;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;">Acessar Conta</button>

    <a href="#" style="align-self:center;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#A1A1AA;padding:8px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.5 15.5M8.7 9.3L20 20"/></svg>
      Sou barbeiro · Acessar como Profissional
