<!doctype html>
<html>
<head>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }

</helmet>
<div style="width:390px;height:844px;background:#121214;display:flex;flex-direction:column;overflow:hidden;position:relative;">

    </div>
    <div style="font-size:20px;font-weight:600;color:#F4F4F5;">Escolher Serviço</div>
  </div>

          <div style="font-size:13px;font-weight:400;color:#A1A1AA;">40min · avaliação 4.9</div>
        </div>

        <div style="width:44px;height:44px;flex-shrink:0;border-radius:12px;background:rgba(217,119,6,0.10);display:flex;align-items:center;justify-content:center;">

          <div style="width:22px;height:22px;border-radius:999px;border:1.5px solid #3F3F46;"></div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:14px;background:#1E1E24;border:1px solid #3F3F46;border-radius:16px;padding:16px;">
        <div style="width:44px;height:44px;flex-shrink:0;border-radius:12px;background:rgba(217,119,6,0.10);display:flex;align-items:center;justify-content:center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 12h6M12 9v6"/></svg>

          <div style="font-size:15px;font-weight:600;color:#F4F4F5;">Combo Corte + Barba</div>
          <div style="font-size:13px;font-weight:400;color:#A1A1AA;">60min · avaliação 4.9</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <div style="font-size:15px;font-weight:700;color:#F4F4F5;">R$ 65</div>
          <div style="width:22px;height:22px;border-radius:999px;border:1.5px solid #3F3F46;"></div>
        </div>
      </div>

    </div>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="font-size:16px;font-weight:600;color:#F4F4F5;">Escolha o barbeiro</div>
      <div class="scroller" style="display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;">
        <div style="flex:0 0 132px;background:#1E1E24;border:1.5px solid #D97706;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;">

            <svg width="16" height="16" viewBox="0 0 24 24" fill="#D97706" stroke="none"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 5 6.5 5c2 0 3.5 1.2 4.5 2.6C12 6.2 13.5 5 15.5 5 19 5 21.5 8.5 19.5 12.5 17 16.65 12 21 12 21z"/></svg>
          </div>
          <div style="width:48px;height:48px;border-radius:999px;background:linear-gradient(135deg,#3F3F46,#26262E);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#F4F4F5;">RC</div>
          <div style="display:flex;flex-direction:column;gap:2px;">
            <div style="font-size:13px;font-weight:600;color:#F4F4F5;">Rafael C.</div>

        </div>
        <div style="flex:0 0 132px;background:#1E1E24;border:1px solid #3F3F46;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;">
          <div style="position:absolute;top:10px;right:10px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.8"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 5 6.5 5c2 0 3.5 1.2 4.5 2.6C12 6.2 13.5 5 15.5 5 19 5 21.5 8.5 19.5 12.5 17 16.65 12 21 12 21z"/></svg>

          <div style="display:flex;flex-direction:column;gap:2px;">
            <div style="font-size:13px;font-weight:600;color:#F4F4F5;">Thiago L.</div>
            <div style="font-size:11px;font-weight:400;color:#A1A1AA;">Especialista barba</div>
          </div>
          <div style="display:flex;align-items:center;gap:3px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="#D97706"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>
            <span style="font-size:12px;color:#A1A1AA;">4.8</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div style="position:absolute;bottom:0;left:0;right:0;padding:16px 20px 28px;background:linear-gradient(180deg,rgba(18,18,20,0) 0%,#121214 30%);">
    <button style="width:100%;height:52px;border:none;border-radius:12px;background:#D97706;color:#121214;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;">Continuar</button>
  </div>
</div>
</x-dc>
</body>
</html>
