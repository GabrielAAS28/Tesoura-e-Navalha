<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #D97706; text-decoration: none; }
    .scroller::-webkit-scrollbar { display: none; }
    input::placeholder, textarea::placeholder { color: #A1A1AA; opacity: 1; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#121214;display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:28px 20px 12px;flex-shrink:0;">
    <div style="display:flex;align-items:center;gap:16px;">
      <div style="width:44px;height:44px;border-radius:12px;background:#1E1E24;border:1px solid #3F3F46;display:flex;align-items:center;justify-content:center;color:#F4F4F5;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </div>
      <div style="font-size:20px;font-weight:600;color:#F4F4F5;">Cadastro de Profissional</div>
    </div>
    <div style="height:26px;padding:0 12px;border-radius:999px;background:rgba(217,119,6,0.15);display:flex;align-items:center;flex-shrink:0;">
      <span style="font-size:11px;font-weight:600;color:#D97706;">1/2</span>
    </div>
  </div>

  <div class="scroller" style="flex:1;overflow-y:auto;padding:16px 20px 40px;display:flex;flex-direction:column;gap:28px;">

    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
      <div style="width:96px;height:96px;border-radius:999px;background:#1E1E24;border:1.5px dashed #3F3F46;display:flex;align-items:center;justify-content:center;position:relative;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1.2a2 2 0 0 0 1.6-.8l.6-.8a2 2 0 0 1 1.6-.8h2a2 2 0 0 1 1.6.8l.6.8a2 2 0 0 0 1.6.8H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <div style="position:absolute;bottom:0;right:0;width:30px;height:30px;border-radius:999px;background:#D97706;border:2px solid #121214;display:flex;align-items:center;justify-content:center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#121214" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      </div>
      <a href="#" style="font-size:13px;font-weight:600;">Adicionar foto de perfil</a>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px;">
      <div style="display:flex;flex-direction:column;gap:8px;">
        <div style="font-size:12px;font-weight:600;color:#A1A1AA;">Nome completo</div>
        <div style="height:52px;border-radius:12px;background:#1E1E24;border:1px solid #3F3F46;display:flex;align-items:center;padding:0 14px;">
          <input type="text" placeholder="Seu nome" style="flex:1;border:none;background:transparent;outline:none;font-family:inherit;font-size:14px;font-weight:500;color:#F4F4F5;">
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;">
        <div style="font-size:12px;font-weight:600;color:#A1A1AA;">Número de telefone</div>
        <div style="height:52px;border-radius:12px;background:#1E1E24;border:1px solid #3F3F46;display:flex;align-items:center;padding:0 6px 0 14px;gap:10px;">
          <div style="display:flex;align-items:center;gap:6px;padding-right:10px;border-right:1px solid #3F3F46;">
            <span style="font-size:15px;">🇧🇷</span>
            <span style="font-size:14px;font-weight:600;color:#F4F4F5;">+55</span>
          </div>
          <input type="text" placeholder="(11) 98765-4321" style="flex:1;border:none;background:transparent;outline:none;font-family:inherit;font-size:14px;font-weight:500;color:#F4F4F5;">
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;">
        <div style="font-size:12px;font-weight:600;color:#A1A1AA;">E-mail</div>
        <div style="height:52px;border-radius:12px;background:#1E1E24;border:1px solid #3F3F46;display:flex;align-items:center;padding:0 14px;">
          <input type="text" placeholder="voce@email.com" style="flex:1;border:none;background:transparent;outline:none;font-family:inherit;font-size:14px;font-weight:500;color:#F4F4F5;">
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;">
        <div style="font-size:12px;font-weight:600;color:#A1A1AA;">CPF</div>
        <div style="height:52px;border-radius:12px;background:#1E1E24;border:1px solid #3F3F46;display:flex;align-items:center;padding:0 14px;">
          <input type="text" placeholder="000.000.000-00" style="flex:1;border:none;background:transparent;outline:none;font-family:inherit;font-size:14px;font-weight:500;color:#F4F4F5;">
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="font-size:15px;font-weight:600;color:#F4F4F5;">Especialidades</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        <div style="height:44px;padding:0 16px;border-radius:999px;background:#D97706;display:flex;align-items:center;"><span style="font-size:13px;font-weight:700;color:#121214;">Corte</span></div>
        <div style="height:44px;padding:0 16px;border-radius:999px;background:#D97706;display:flex;align-items:center;"><span style="font-size:13px;font-weight:700;color:#121214;">Barba</span></div>
        <div style="height:44px;padding:0 16px;border-radius:999px;border:1px solid #3F3F46;display:flex;align-items:center;"><span style="font-size:13px;font-weight:600;color:#F4F4F5;">Combo</span></div>
        <div style="height:44px;padding:0 16px;border-radius:999px;border:1px solid #3F3F46;display:flex;align-items:center;"><span style="font-size:13px;font-weight:600;color:#F4F4F5;">Pigmentação</span></div>
        <div style="height:44px;padding:0 16px;border-radius:999px;border:1px solid #3F3F46;display:flex;align-items:center;"><span style="font-size:13px;font-weight:600;color:#F4F4F5;">Sobrancelha</span></div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="font-size:15px;font-weight:600;color:#F4F4F5;">Anos de experiência</div>
      <div style="display:flex;gap:8px;">
        <div style="flex:1;height:44px;border-radius:12px;border:1px solid #3F3F46;display:flex;align-items:center;justify-content:center;"><span style="font-size:12px;font-weight:600;color:#F4F4F5;">&lt; 1 ano</span></div>
        <div style="flex:1;height:44px;border-radius:12px;background:#D97706;display:flex;align-items:center;justify-content:center;"><span style="font-size:12px;font-weight:700;color:#121214;">1–3 anos</span></div>
        <div style="flex:1;height:44px;border-radius:12px;border:1px solid #3F3F46;display:flex;align-items:center;justify-content:center;"><span style="font-size:12px;font-weight:600;color:#F4F4F5;">3–5 anos</span></div>
        <div style="flex:1;height:44px;border-radius:12px;border:1px solid #3F3F46;display:flex;align-items:center;justify-content:center;"><span style="font-size:12px;font-weight:600;color:#F4F4F5;">5+ anos</span></div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="font-size:12px;font-weight:600;color:#A1A1AA;">Sobre mim</div>
      <div style="height:96px;border-radius:12px;background:#1E1E24;border:1px solid #3F3F46;padding:14px;">
        <textarea placeholder="Conte um pouco sobre sua experiência e estilo de trabalho..." style="width:100%;height:100%;border:none;background:transparent;outline:none;resize:none;font-family:inherit;font-size:14px;font-weight:500;color:#F4F4F5;"></textarea>
      </div>
    </div>

  </div>

  <div style="position:absolute;bottom:0;left:0;right:0;padding:16px 20px 28px;background:linear-gradient(180deg,rgba(18,18,20,0) 0%,#121214 30%);">
    <button style="width:100%;height:52px;border:none;border-radius:12px;background:#D97706;color:#121214;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;">Continuar</button>
  </div>
</div>
</x-dc>
</body>
</html>
