<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .scroller::-webkit-scrollbar { display: none; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#121214;display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div style="display:flex;align-items:center;gap:16px;padding:28px 20px 12px;flex-shrink:0;">
    <div style="width:44px;height:44px;border-radius:12px;background:#1E1E24;border:1px solid #3F3F46;display:flex;align-items:center;justify-content:center;color:#F4F4F5;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </div>
    <div style="font-size:20px;font-weight:600;color:#F4F4F5;">Horários &amp; Expediente</div>
  </div>

  <div class="scroller" style="flex:1;overflow-y:auto;padding:16px 20px 40px;display:flex;flex-direction:column;gap:28px;">

    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="font-size:15px;font-weight:600;color:#F4F4F5;">Dias de trabalho</div>
      <div style="display:flex;justify-content:space-between;gap:6px;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:44px;height:44px;border-radius:999px;background:#D97706;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#121214;">S</div></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:44px;height:44px;border-radius:999px;background:#D97706;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#121214;">T</div></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:44px;height:44px;border-radius:999px;background:#D97706;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#121214;">Q</div></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:44px;height:44px;border-radius:999px;background:#D97706;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#121214;">Q</div></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:44px;height:44px;border-radius:999px;background:#D97706;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#121214;">S</div></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:44px;height:44px;border-radius:999px;background:#D97706;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#121214;">S</div></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:44px;height:44px;border-radius:999px;background:#1E1E24;border:1px solid #3F3F46;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#A1A1AA;">D</div></div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;">
      <div style="font-size:15px;font-weight:600;color:#F4F4F5;">Expediente por dia</div>

      <div style="display:flex;align-items:center;justify-content:space-between;background:#1E1E24;border:1px solid #3F3F46;border-radius:12px;padding:12px 14px;">
        <div style="font-size:13px;font-weight:600;color:#F4F4F5;">Segunda a Sexta</div>
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:13px;font-weight:600;color:#F4F4F5;">09:00 – 19:00</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;background:#1E1E24;border:1px solid #3F3F46;border-radius:12px;padding:12px 14px;">
        <div style="font-size:13px;font-weight:600;color:#F4F4F5;">Sábado</div>
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:13px;font-weight:600;color:#F4F4F5;">09:00 – 15:00</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;background:#1E1E24;border:1px solid #3F3F46;border-radius:12px;padding:12px 14px;opacity:0.5;">
        <div style="font-size:13px;font-weight:600;color:#F4F4F5;">Domingo</div>
        <span style="font-size:13px;font-weight:500;color:#A1A1AA;">Fechado</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="font-size:15px;font-weight:600;color:#F4F4F5;">Intervalo de almoço</div>
        <div style="width:44px;height:24px;border-radius:999px;background:#D97706;display:flex;align-items:center;padding:2px;justify-content:flex-end;">
          <div style="width:20px;height:20px;border-radius:999px;background:#121214;"></div>
        </div>
      </div>
      <div style="display:flex;gap:10px;">
        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
          <div style="font-size:11px;font-weight:600;color:#A1A1AA;">Início</div>
          <div style="height:46px;border-radius:12px;background:#1E1E24;border:1px solid #3F3F46;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#F4F4F5;">12:00</div>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
          <div style="font-size:11px;font-weight:600;color:#A1A1AA;">Fim</div>
          <div style="height:46px;border-radius:12px;background:#1E1E24;border:1px solid #3F3F46;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#F4F4F5;">13:30</div>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="font-size:15px;font-weight:600;color:#F4F4F5;">Intervalo entre clientes</div>
      <div style="display:flex;gap:10px;">
        <div style="flex:1;height:44px;border-radius:12px;border:1px solid #3F3F46;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#F4F4F5;">0 min</div>
        <div style="flex:1;height:44px;border-radius:12px;background:#D97706;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#121214;">10 min</div>
        <div style="flex:1;height:44px;border-radius:12px;border:1px solid #3F3F46;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#F4F4F5;">15 min</div>
      </div>
      <div style="font-size:12px;font-weight:400;color:#A1A1AA;">Tempo de folga automático entre cada atendimento</div>
    </div>

  </div>

  <div style="position:absolute;bottom:0;left:0;right:0;padding:16px 20px 28px;background:linear-gradient(180deg,rgba(18,18,20,0) 0%,#121214 30%);">
    <button style="width:100%;height:52px;border:none;border-radius:12px;background:#D97706;color:#121214;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;">Salvar Configurações</button>
  </div>
</div>
</x-dc>
</body>
</html>
